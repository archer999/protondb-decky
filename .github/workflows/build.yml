name: Build and Release ProtonDB Badges

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Prepare release package
        run: |
          rm -rf ./release
          mkdir -p ./release
          cp LICENSE ./release/
          cp plugin.json ./release/
          cp main.py ./release/
          cp settings.py ./release/
          cp -R dist ./release/
          cp -R assets ./release/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: protondb-decky
          path: ./release

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: protondb-decky
          path: protondb-decky

      - name: Zip release bundle
        run: |
          cd protondb-decky
          zip -r ../protondb-decky-${{ github.ref_name }}.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: protondb-decky-${{ github.ref_name }}.zip
          generate_release_notes: true
